name: Update master data

on:
  workflow_dispatch:
  schedule:
    # Daily at 12:20 JST (03:20 UTC), after the game's usual data update window.
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: esterTion/redive_master_db_diff
          path: .upstream
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest requests
      - name: Download latest source DB
        run: |
          mkdir -p .input
          curl --fail --location --retry 3 --output .input/roboninon.db https://roboninon.win/db/download
      - name: Generate
        run: python scripts/generate_master_data.py --upstream .upstream --db .input/roboninon.db --output dist --force
      - name: Verify
        run: python -m pytest -q
      - name: Sync Google Sheets
        if: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL != '' && secrets.APPS_SCRIPT_WEBHOOK_TOKEN != '' }}
        env:
          APPS_SCRIPT_WEBHOOK_URL: ${{ secrets.APPS_SCRIPT_WEBHOOK_URL }}
          APPS_SCRIPT_WEBHOOK_TOKEN: ${{ secrets.APPS_SCRIPT_WEBHOOK_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, requests
          with open('dist/master_data.json', encoding='utf-8') as f:
              payload = json.load(f)
          r = requests.post(os.environ['APPS_SCRIPT_WEBHOOK_URL'], json={
              'token': os.environ['APPS_SCRIPT_WEBHOOK_TOKEN'],
              'payload': payload,
          }, timeout=60)
          r.raise_for_status()
          result = r.json()
          if not result.get('ok'):
              raise RuntimeError(result)
          print(result)
      - name: Publish changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || git commit -m "chore: update master data"
          git push
